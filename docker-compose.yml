services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - mailpit
    environment:
      APP_NAME: ${APP_NAME}
      HOST: 0.0.0.0
      # HOST must be 0.0.0.0 for the server to accept connections from
      # outside the container, but that's not a reachable client-facing
      # address — APP_URL is used to build public URLs (e.g. image links)
      # and needs the host-published port instead.
      APP_URL: http://localhost:3333
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_DATABASE: ${POSTGRES_DB}
      REDIS_HOST: redis
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      # Secret key and webhook secret stay server-side — never passed to web.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PLATFORM_FEE_BPS: ${STRIPE_PLATFORM_FEE_BPS:-650}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3333:3333"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - pnpm_store:/pnpm-store

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
      - redis
    environment:
      APP_NAME: ${APP_NAME}
      WATCHPACK_POLLING: "true"
      API_INTERNAL_URL: http://api:3333
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Publishable key only. NEXT_PUBLIC_* is inlined into the browser
      # bundle, so the secret key must never appear here.
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - pnpm_store:/pnpm-store

volumes:
  postgres_data:
  redis_data:
  pnpm_store:
